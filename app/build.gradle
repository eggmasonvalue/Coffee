plugins {
    id "com.android.application"
    id "com.google.devtools.ksp"
}

android {
    namespace = "com.github.muellerma.coffee"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.github.muellerma.coffee"
        minSdk = 37
        targetSdk = 37
        versionCode = 50
        versionName = "3.2"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        encoding = "UTF-8"
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        disable 'AndroidGradlePluginVersion', 'NewerVersionAvailable', 'GradleDependency'
    }

    sourceSets {
        debug {
            assets.srcDirs += layout.buildDirectory.dir("generated/ksp/debug/resources/assets")
        }
        release {
            assets.srcDirs += layout.buildDirectory.dir("generated/ksp/release/resources/assets")
        }
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    def variantName = it.name.substring(5, it.name.length() - 6) // e.g. "Debug"
    dependsOn("ksp${variantName}Kotlin")
}

dependencies {
    implementation "androidx.appfunctions:appfunctions:1.0.0-alpha12"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    ksp "androidx.appfunctions:appfunctions-compiler:1.0.0-alpha12"
}
